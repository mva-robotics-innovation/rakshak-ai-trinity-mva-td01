<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="t d"><title id="t">Proposed tri-domain integration mechanism</title><desc id="d">Conceptual side perspective showing a buoyant hull, folding wheel struts, rear ducted thrusters, aerial arm modules and a protected electronics spine.</desc>
