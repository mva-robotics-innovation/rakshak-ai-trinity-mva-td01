<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d"><title id="t">Tri-domain operating state flow</title><desc id="d">Concept mission flow from checks to mutually exclusive air, water or land states, through safe transitions and failsafe handling.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3fb"/></linearGradient><linearGradient id="h" x2="1"><stop stop-color="#09305b"/><stop offset="1" stop-color="#087ea4"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#1484b4"/></marker><style>.b{fill:#fff;stroke:#9bc6e4;stroke-width:2}.t{font:700 19px Arial;fill:#133653}.s{font:14px Arial;fill:#45647e}.hd{fill:url(#h)}.ht{font:700 20px Arial;fill:#fff}.l{fill:none;stroke:#1484b4;stroke-width:3;marker-end:url(#a)}.warn{fill:#fff8e9;stroke:#df9b2a;stroke-width:2}.w{font:700 17px Arial;fill:#805112}</style></defs><rect width="1400" height="900" rx="24" fill="url(#bg)"/><text x="38" y="48" font-family="Arial" font-size="29" font-weight="700" fill="#0c2f4f">MISSION &amp; DOMAIN STATE FLOW</text><text x="40" y="76" class="s">Planned logic — implement as a tested state machine with explicit transition gates and emergency stop</text>
<rect x="500" y="105" width="400" height="76" rx="18" class="hd"/><text x="700" y="137" class="ht" text-anchor="middle">POWER ON / MISSION START</text><text x="700" y="161" class="s" text-anchor="middle" fill="#e5f5ff">Self-test • link check • sensor health</text>
<path d="M700 181 V220" class="l"/><path d="M700 220 l105 58 -105 58 -105 -58z" class="b"/><text x="700" y="273" class="t" text-anchor="middle">Preflight</text><text x="700" y="296" class="s" text-anchor="middle">passes?</text>
<path d="M595 278 H330 V340" class="l"/><text x="440" y="265" class="s">NO</text><rect x="155" y="340" width="350" height="78" rx="14" class="warn"/><text x="330" y="371" class="w" text-anchor="middle">SAFE / ABORT</text><text x="330" y="396" class="s" text-anchor="middle">Disarm • report fault • inspect</text><path d="M700 336 V375" class="l"/><text x="718" y="358" class="s">YES</text>
<path d="M700 375 l130 70 -130 70 -130 -70z" class="b"/><text x="700" y="440" class="t" text-anchor="middle">Select domain</text><text x="700" y="464" class="s" text-anchor="middle">Air / Water / Land</text>
<!-- three domains -->
<path d="M570 445 H245 V545" class="l"/><path d="M700 515 V545" class="l"/><path d="M830 445 H1155 V545" class="l"/>
<g><rect x="70" y="545" width="350" height="135" rx="16" class="b"/><rect x="70" y="545" width="350" height="42" rx="16" fill="#1e6bb7"/><rect x="70" y="569" width="350" height="18" fill="#1e6bb7"/><text x="245" y="574" class="ht" text-anchor="middle">AIR MODE</text><text x="95" y="617" class="t">Wheels: stowed + locked</text><text x="95" y="644" class="t">Thrusters: disabled</text><text x="95" y="665" class="s">Arm only after verified checks</text></g>
<g><rect x="525" y="545" width="350" height="135" rx="16" class="b"/><rect x="525" y="545" width="350" height="42" rx="16" fill="#1597a7"/><rect x="525" y="569" width="350" height="18" fill="#1597a7"/><text x="700" y="574" class="ht" text-anchor="middle">WATER MODE</text><text x="550" y="617" class="t">Flight motors: disarmed</text><text x="550" y="644" class="t">Hull seal / buoyancy check</text><text x="550" y="665" class="s">Thrusters enabled only in water-safe state</text></g>
<g><rect x="980" y="545" width="350" height="135" rx="16" class="b"/><rect x="980" y="545" width="350" height="42" rx="16" fill="#56834d"/><rect x="980" y="569" width="350" height="18" fill="#56834d"/><text x="1155" y="574" class="ht" text-anchor="middle">LAND MODE</text><text x="1005" y="617" class="t">Flight motors: disarmed</text><text x="1005" y="644" class="t">Wheels deployed + locked</text><text x="1005" y="665" class="s">Drive enabled after feedback checks</text></g>
<!-- convergence -->
<path d="M245 680 V722 H700 V745" class="l"/><path d="M700 680 V745" class="l"/><path d="M1155 680 V722 H700" class="l"/>
<rect x="430" y="745" width="540" height="75" rx="16" class="hd"/><text x="700" y="776" class="ht" text-anchor="middle">CONTINUOUS SAFETY SUPERVISION</text><text x="700" y="800" class="s" text-anchor="middle">Battery • link • leak / water ingress • tilt • actuator status</text>
<path d="M970 783 H1050" class="l"/><rect x="1050" y="745" width="300" height="75" rx="14" class="warn"/><text x="1200" y="776" class="w" text-anchor="middle">FAULT / LOW BATTERY</text><text x="1200" y="800" class="s" text-anchor="middle">Abort + validated safe response</text>
<text x="38" y="866" class="s">Domain transitions must be mutually interlocked; never transition directly between powered actuators without a verified safe intermediate state.</text>
</svg>
