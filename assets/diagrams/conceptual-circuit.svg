<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Conceptual power distribution circuit</title><desc id="d">High-level power circuit from 6S battery through protection to distribution, ESCs, thrusters, regulated electronics rails and sensors.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3fb"/></linearGradient><linearGradient id="h" x2="1"><stop stop-color="#09305b"/><stop offset="1" stop-color="#087ea4"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#d28c28"/></marker><style>.b{fill:#fff;stroke:#9bc6e4;stroke-width:2}.h{fill:url(#h)}.ht{font:700 18px Arial;fill:#fff}.t{font:600 16px Arial;fill:#133653}.s{font:13px Arial;fill:#45647e}.p{fill:none;stroke:#d28c28;stroke-width:4;marker-end:url(#arr)}.r{fill:#fff8e9;stroke:#dfa23c;stroke-width:2}.warn{font:700 17px Arial;fill:#805112}</style></defs><rect width="1400" height="820" rx="24" fill="url(#bg)"/><text x="36" y="46" font-family="Arial" font-size="29" font-weight="700" fill="#0c2f4f">CONCEPTUAL POWER / CIRCUIT DIAGRAM</text><text x="38" y="73" class="s">Illustrative topology only — not a fabrication-ready schematic; ratings, pinouts, wire gauge and protection must be calculated</text>
<!-- battery chain -->
<rect x="35" y="145" width="210" height="120" rx="15" class="b"/><rect x="35" y="145" width="210" height="36" rx="15" class="h"/><rect x="35" y="164" width="210" height="17" fill="url(#h)"/><text x="140" y="170" class="ht" text-anchor="middle">6S LiPo</text><text x="140" y="211" class="t" text-anchor="middle">22.2 V nominal</text><text x="140" y="237" class="t" text-anchor="middle">16 Ah proposed</text>
<rect x="295" y="145" width="225" height="120" rx="15" class="b"/><rect x="295" y="145" width="225" height="36" rx="15" class="h"/><rect x="295" y="164" width="225" height="17" fill="url(#h)"/><text x="407" y="170" class="ht" text-anchor="middle">PROTECTION</text><text x="407" y="211" class="t" text-anchor="middle">Main fuse / disconnect</text><text x="407" y="237" class="t" text-anchor="middle">Anti-spark / current sense</text>
<rect x="570" y="145" width="220" height="120" rx="15" class="b"/><rect x="570" y="145" width="220" height="36" rx="15" class="h"/><rect x="570" y="164" width="220" height="17" fill="url(#h)"/><text x="680" y="170" class="ht" text-anchor="middle">POWER BUS / PDB</text><text x="680" y="211" class="t" text-anchor="middle">Protected branches</text><text x="680" y="237" class="t" text-anchor="middle">Voltage / current monitor</text>
<path d="M245 205 H295" class="p"/><path d="M520 205 H570" class="p"/>
<!-- branch boxes -->
<g><rect x="875" y="115" width="235" height="100" rx="14" class="b"/><text x="992" y="151" class="t" text-anchor="middle">4 × AIR ESCs</text><text x="992" y="177" class="s" text-anchor="middle">Each ESC sized for motor</text><text x="992" y="196" class="s" text-anchor="middle">and propeller load</text></g>
<g><rect x="1150" y="115" width="220" height="100" rx="14" class="b"/><text x="1260" y="151" class="t" text-anchor="middle">4 × MOTORS</text><text x="1260" y="177" class="s" text-anchor="middle">15-inch propellers</text><text x="1260" y="196" class="s" text-anchor="middle">Guarded test only</text></g>
<path d="M790 175 H835 V165 H875" class="p"/><path d="M1110 165 H1150" class="p"/>
<g><rect x="875" y="270" width="235" height="100" rx="14" class="b"/><text x="992" y="306" class="t" text-anchor="middle">2 × THRUSTER DRIVES</text><text x="992" y="332" class="s" text-anchor="middle">Voltage / current matched</text><text x="992" y="351" class="s" text-anchor="middle">to CDT-9024 datasheet</text></g>
<g><rect x="1150" y="270" width="220" height="100" rx="14" class="b"/><text x="1260" y="306" class="t" text-anchor="middle">2 × WATER THRUSTERS</text><text x="1260" y="332" class="s" text-anchor="middle">Sealed bulkhead</text><text x="1260" y="351" class="s" text-anchor="middle">connectors / strain relief</text></g>
<path d="M790 205 H835 V320 H875" class="p"/><path d="M1110 320 H1150" class="p"/>
<g><rect x="570" y="340" width="220" height="115" rx="14" class="b"/><text x="680" y="376" class="t" text-anchor="middle">DC–DC REGULATORS</text><text x="680" y="402" class="s" text-anchor="middle">Dedicated 5 V / 12 V rails</text><text x="680" y="424" class="s" text-anchor="middle">Continuous-load rated</text><text x="680" y="443" class="s" text-anchor="middle">with transient margin</text></g><path d="M680 265 V340" class="p"/>
<g><rect x="295" y="340" width="225" height="115" rx="14" class="b"/><text x="407" y="376" class="t" text-anchor="middle">CONTROL ELECTRONICS</text><text x="407" y="402" class="s" text-anchor="middle">Pixhawk 6C • Raspberry Pi 5</text><text x="407" y="424" class="s" text-anchor="middle">Isolated / regulated feed</text><text x="407" y="443" class="s" text-anchor="middle">according to vendor specs</text></g><path d="M570 398 H520" class="p"/>
<g><rect x="35" y="340" width="210" height="115" rx="14" class="b"/><text x="140" y="376" class="t" text-anchor="middle">LOW-POWER LOADS</text><text x="140" y="402" class="s" text-anchor="middle">GPS • sensors • telemetry</text><text x="140" y="424" class="s" text-anchor="middle">Camera / gimbal</text><text x="140" y="443" class="s" text-anchor="middle">Wheel servos (sized rail)</text></g><path d="M295 398 H245" class="p"/>
<rect x="40" y="535" width="1320" height="200" rx="18" class="r"/><text x="70" y="575" class="warn">MANDATORY ENGINEERING CHECKS BEFORE BUILD</text><text x="70" y="612" class="t">• Verify battery continuous / burst current, connector ratings, branch protection, wire gauge and heat rise.</text><text x="70" y="644" class="t">• Confirm the exact CALANDIS controller requirements, control protocol and whether reverse is supported.</text><text x="70" y="676" class="t">• Keep propulsion power separate from clean logic rails; plan grounding, EMI, fusing and ingress sealing.</text><text x="70" y="708" class="t">• A qualified engineer must produce the final pin-level schematic and bench-test it with propellers / thrusters disabled.</text>
</svg>
