<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d">
<title id="t">MVA-TD01 system architecture</title><desc id="d">High-level architecture showing power, compute, sensing, communications and three domain actuation systems.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3fb"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#07305d"/><stop offset="1" stop-color="#087ea4"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1785b7"/></marker><style>.box{fill:#fff;stroke:#9bc6e4;stroke-width:2}.hd{fill:url(#head)}.ht{font:700 21px Arial;fill:#fff}.tx{font:600 17px Arial;fill:#133653}.sm{font:14px Arial;fill:#45647e}.line{stroke:#1785b7;stroke-width:3;fill:none;marker-end:url(#arr)}.pwr{stroke:#d18b2c;stroke-width:4;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:8 7}</style></defs>
<rect width="1400" height="760" rx="24" fill="url(#bg)"/>
<text x="38" y="48" font-family="Arial" font-size="29" font-weight="700" fill="#0c2f4f">SYSTEM ARCHITECTURE — MVA-TD01</text><text x="40" y="76" class="sm">Concept-level architecture • interfaces and protection sizing to be finalized by the engineering team</text>
<!-- central -->
<rect x="510" y="300" width="380" height="150" rx="18" class="box" stroke="#087ea4" stroke-width="3"/>
<rect x="510" y="300" width="380" height="43" rx="18" class="hd"/><rect x="510" y="324" width="380" height="19" fill="url(#head)"/><text x="700" y="328" class="ht" text-anchor="middle">MVA-TD01 CONTROL CORE</text><text x="700" y="372" class="tx" text-anchor="middle">Pixhawk 6C • flight / attitude</text><text x="700" y="401" class="tx" text-anchor="middle">Raspberry Pi 5 • mission / vision</text><text x="700" y="428" class="sm" text-anchor="middle">Mode supervisor + safety interlocks</text>
<!-- top nodes -->
<g><rect x="55" y="130" width="300" height="130" rx="14" class="box"/><rect x="55" y="130" width="300" height="38" rx="14" class="hd"/><rect x="55" y="151" width="300" height="17" fill="url(#head)"/><text x="205" y="155" class="ht" text-anchor="middle">SENSORS</text><text x="80" y="197" class="tx">4K 3-axis camera gimbal</text><text x="80" y="222" class="tx">GPS • IMU • barometer • LiDAR</text><text x="80" y="245" class="sm">Sonar / depth • optional water sensors</text></g>
<g><rect x="550" y="120" width="300" height="125" rx="14" class="box"/><rect x="550" y="120" width="300" height="38" rx="14" class="hd"/><rect x="550" y="141" width="300" height="17" fill="url(#head)"/><text x="700" y="145" class="ht" text-anchor="middle">COMMUNICATIONS</text><text x="575" y="187" class="tx">2.4 GHz RC • 5.8 GHz video</text><text x="575" y="212" class="tx">900 MHz telemetry • 4G LTE</text><text x="575" y="234" class="sm">Mission Planner / QGroundControl</text></g>
<g><rect x="1045" y="130" width="300" height="130" rx="14" class="box"/><rect x="1045" y="130" width="300" height="38" rx="14" class="hd"/><rect x="1045" y="151" width="300" height="17" fill="url(#head)"/><text x="1195" y="155" class="ht" text-anchor="middle">POWER MANAGEMENT</text><text x="1070" y="197" class="tx">6S 22.2 V LiPo • 16 Ah</text><text x="1070" y="222" class="tx">Fuse / main disconnect / PDB</text><text x="1070" y="245" class="sm">Regulated rails • voltage/current sensing</text></g>
<!-- bottom nodes -->
<g><rect x="55" y="515" width="380" height="160" rx="14" class="box"/><rect x="55" y="515" width="380" height="40" rx="14" class="hd"/><rect x="55" y="537" width="380" height="18" fill="url(#head)"/><text x="245" y="542" class="ht" text-anchor="middle">AIR ACTUATION</text><text x="80" y="584" class="tx">4 × ESC + 2207 brushless motors</text><text x="80" y="610" class="tx">15-inch propellers • 4 carbon arms</text><text x="80" y="638" class="sm">Arming + motor-stop interlock</text></g>
<g><rect x="510" y="515" width="380" height="160" rx="14" class="box"/><rect x="510" y="515" width="380" height="40" rx="14" class="hd"/><rect x="510" y="537" width="380" height="18" fill="url(#head)"/><text x="700" y="542" class="ht" text-anchor="middle">WATER ACTUATION</text><text x="535" y="584" class="tx">2 × CALANDIS CDT-9024 thrusters</text><text x="535" y="610" class="tx">Reversible / throttle interface TBD</text><text x="535" y="638" class="sm">Water-mode interlock • sealed connectors</text></g>
<g><rect x="965" y="515" width="380" height="160" rx="14" class="box"/><rect x="965" y="515" width="380" height="40" rx="14" class="hd"/><rect x="965" y="537" width="380" height="18" fill="url(#head)"/><text x="1155" y="542" class="ht" text-anchor="middle">LAND ACTUATION</text><text x="990" y="584" class="tx">4 × wheel modules / folding struts</text><text x="990" y="610" class="tx">Servo actuators • lock-pin feedback</text><text x="990" y="638" class="sm">Deployment sensors + drive control TBD</text></g>
<!-- lines -->
<path d="M355 195 L435 195 L435 330 L510 330" class="line"/><path d="M700 245 L700 300" class="line"/><path d="M1045 195 L970 195 L970 330 L890 330" class="pwr"/>
<path d="M610 450 L610 480 L245 480 L245 515" class="line"/><path d="M700 450 L700 515" class="line"/><path d="M790 450 L790 480 L1155 480 L1155 515" class="line"/>
<text x="35" y="720" class="sm">Blue = control / data path • Amber = power distribution concept • Not a pin-by-pin wiring plan</text>
</svg>
