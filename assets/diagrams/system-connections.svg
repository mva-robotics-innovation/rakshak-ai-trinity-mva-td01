<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d"><title id="t">System signal and connection diagram</title><desc id="d">Control, telemetry and actuation wiring layout with central controller, sensors, communications, ESCs, thruster drives and wheel servos.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf3fb"/></linearGradient><linearGradient id="h" x2="1"><stop stop-color="#09305b"/><stop offset="1" stop-color="#087ea4"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#1785b7"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#5a9560"/></marker><style>.b{fill:#fff;stroke:#9bc6e4;stroke-width:2}.h{fill:url(#h)}.ht{font:700 18px Arial;fill:#fff}.t{font:600 16px Arial;fill:#133653}.s{font:13px Arial;fill:#45647e}.l{fill:none;stroke:#1785b7;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#5a9560;stroke-width:3;stroke-dasharray:7 6;marker-end:url(#g)}</style></defs><rect width="1400" height="800" rx="24" fill="url(#bg)"/><text x="36" y="46" font-family="Arial" font-size="29" font-weight="700" fill="#0c2f4f">SIGNAL / CONTROL CONNECTIONS</text><text x="38" y="73" class="s">Logical interfaces only • confirm connector pinouts, voltage levels, isolation and protocol support from actual datasheets</text>
<!-- Flight controller center -->
<rect x="510" y="285" width="380" height="180" rx="18" class="b" stroke="#087ea4" stroke-width="3"/><rect x="510" y="285" width="380" height="42" rx="18" class="h"/><rect x="510" y="307" width="380" height="20" fill="url(#h)"/><text x="700" y="313" class="ht" text-anchor="middle">PIXHAWK 6C FLIGHT CONTROLLER</text><text x="700" y="355" class="t" text-anchor="middle">PWM / DShot / serial interfaces*</text><text x="700" y="382" class="t" text-anchor="middle">GPS • IMU • barometer • failsafe</text><text x="700" y="411" class="t" text-anchor="middle">Mode supervisor / interlocks</text><text x="700" y="440" class="s" text-anchor="middle">*Exact outputs and firmware configuration TBD</text>
<!-- Raspberry -->
<rect x="520" y="115" width="360" height="105" rx="15" class="b"/><rect x="520" y="115" width="360" height="35" rx="15" class="h"/><rect x="520" y="133" width="360" height="17" fill="url(#h)"/><text x="700" y="139" class="ht" text-anchor="middle">RASPBERRY PI 5 / COMPANION</text><text x="545" y="177" class="t">Vision • object detection • ROS 2</text><text x="545" y="201" class="s">UART / USB / Ethernet or approved bridge</text><path d="M700 220 V285" class="l"/>
<!-- Sensors -->
<g><rect x="40" y="150" width="350" height="130" rx="15" class="b"/><rect x="40" y="150" width="350" height="36" rx="15" class="h"/><rect x="40" y="169" width="350" height="17" fill="url(#h)"/><text x="215" y="175" class="ht" text-anchor="middle">SENSORS</text><text x="65" y="212" class="t">GPS / compass / LiDAR</text><text x="65" y="237" class="t">Camera gimbal • sonar</text><text x="65" y="261" class="s">I²C / UART / USB / serial as supported</text></g><path d="M390 220 H460 V330 H510" class="l"/>
<!-- Comm -->
<g><rect x="1010" y="150" width="350" height="130" rx="15" class="b"/><rect x="1010" y="150" width="350" height="36" rx="15" class="h"/><rect x="1010" y="169" width="350" height="17" fill="url(#h)"/><text x="1185" y="175" class="ht" text-anchor="middle">RADIO / TELEMETRY</text><text x="1035" y="212" class="t">RC receiver • video link</text><text x="1035" y="237" class="t">900 MHz telemetry • 4G LTE</text><text x="1035" y="261" class="s">One or more links may be optional</text></g><path d="M1010 225 H945 V330 H890" class="l"/>
<!-- outputs -->
<g><rect x="35" y="540" width="390" height="150" rx="15" class="b"/><rect x="35" y="540" width="390" height="36" rx="15" class="h"/><rect x="35" y="559" width="390" height="17" fill="url(#h)"/><text x="230" y="565" class="ht" text-anchor="middle">AIR: 4 × ESC / MOTOR</text><text x="60" y="604" class="t">Flight outputs → ESC signal input</text><text x="60" y="630" class="t">ESC power → 4 × brushless motors</text><text x="60" y="659" class="s">Independent arming and propeller-safe test process</text></g>
<g><rect x="505" y="540" width="390" height="150" rx="15" class="b"/><rect x="505" y="540" width="390" height="36" rx="15" class="h"/><rect x="505" y="559" width="390" height="17" fill="url(#h)"/><text x="700" y="565" class="ht" text-anchor="middle">WATER: 2 × THRUSTER DRIVE</text><text x="530" y="604" class="t">Controller / ESC interface TBD</text><text x="530" y="630" class="t">2 × sealed motor / ducted thruster</text><text x="530" y="659" class="s">Do not assume reverse / PWM support without datasheet</text></g>
<g><rect x="975" y="540" width="390" height="150" rx="15" class="b"/><rect x="975" y="540" width="390" height="36" rx="15" class="h"/><rect x="975" y="559" width="390" height="17" fill="url(#h)"/><text x="1170" y="565" class="ht" text-anchor="middle">LAND: 4 × WHEEL MODULES</text><text x="1000" y="604" class="t">Servo actuators / drive modules</text><text x="1000" y="630" class="t">Lock / position limit switches</text><text x="1000" y="659" class="s">ROS 2 wheel control via compatible interface</text></g>
<path d="M610 465 V500 H230 V540" class="l"/><path d="M700 465 V540" class="l"/><path d="M790 465 V500 H1170 V540" class="l"/>
<path d="M425 612 H470 V720 H930 V612 H975" class="d"/><text x="700" y="747" class="s" text-anchor="middle">Green dashed = cross-domain safety / feedback concept • Add separate fused power branches (not shown here)</text>
</svg>
